<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Repositório Regional e Treinamento do Dataverse</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html{width:100%;height:100%;overflow:hidden;}
  body{
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,"DejaVu Sans",sans-serif;
    background:#0d1b2a;color:#0f2233;width:100%;max-width:100vw;
    height:100%;height:100dvh;overflow:hidden;
    padding:clamp(7px,.9vw,16px) clamp(9px,1.3vw,22px) clamp(8px,1vw,18px);
    display:flex;flex-direction:column;gap:clamp(6px,.8vw,12px);
  }
  /* ---------- topo ---------- */
  .head{display:flex;align-items:center;gap:clamp(8px,1vw,15px);flex:0 0 auto;min-width:0;}
  .brand{width:clamp(34px,3.7vw,58px);height:clamp(34px,3.7vw,58px);border-radius:14px;flex:0 0 auto;
    background:linear-gradient(135deg,#2ea3a8,#1b6f8c);display:flex;align-items:center;justify-content:center;}
  .brand svg{width:60%;height:60%;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .titles{flex:1 1 auto;min-width:0;}
  h1{font-size:clamp(15px,1.72vw,29px);font-weight:700;color:#ffffff;line-height:1.12;}
  .sub{font-size:clamp(10px,.92vw,15px);font-weight:600;color:#8fd0d8;margin-top:3px;letter-spacing:.3px;}
  .switch{display:flex;gap:5px;background:rgba(255,255,255,.10);border-radius:999px;
    padding:4px;flex:0 0 auto;}
  .switch button{font-family:inherit;font-size:clamp(9px,.8vw,13px);font-weight:800;letter-spacing:.9px;
    color:#cfe9ec;background:transparent;border:0;border-radius:999px;
    padding:clamp(5px,.55vw,8px) clamp(8px,1.1vw,18px);cursor:pointer;transition:.15s;white-space:nowrap;}
  .switch button:hover{color:#fff;}
  .switch button.on{background:#8fd0d8;color:#0d1b2a;}
  /* ---------- abas ---------- */
  .tabbar{display:flex;flex-wrap:wrap;align-items:stretch;gap:clamp(4px,.5vw,8px);flex:0 0 auto;min-width:0;}
  .tabbtn{
    flex:1 1 clamp(70px,8.6vw,190px);min-width:0;display:flex;align-items:center;justify-content:center;
    gap:clamp(4px,.5vw,8px);
    font-family:inherit;font-size:clamp(9.5px,.92vw,15px);font-weight:700;line-height:1.12;
    color:#b9d3da;background:rgba(255,255,255,.07);border:0;border-radius:11px;
    padding:clamp(6px,.8vw,12px) clamp(4px,.55vw,8px);cursor:pointer;transition:.15s;text-align:left;
  }
  .tabbtn .lbl{min-width:0;overflow-wrap:anywhere;}
  .tabbtn .tnum{width:clamp(15px,1.35vw,22px);height:clamp(15px,1.35vw,22px);border-radius:50%;
    background:rgba(255,255,255,.16);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:clamp(8.5px,.78vw,13px);font-weight:800;}
  .tabbtn:hover{background:rgba(255,255,255,.16);color:#eaf6f8;}
  .tabbtn.on{background:var(--c);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .tabbtn.on .tnum{background:rgba(255,255,255,.28);}
  /* ---------- painel ---------- */
  .panel{flex:1 1 auto;min-height:0;min-width:0;background:#fff;border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 10px 26px rgba(0,0,0,.35);
    border-top:clamp(4px,.4vw,6px) solid var(--c);}
  .phead{display:flex;align-items:center;gap:clamp(8px,1vw,14px);
    padding:clamp(8px,1vw,16px) clamp(12px,2vw,30px) clamp(7px,.9vw,14px);flex:0 0 auto;
    border-bottom:1px solid #e6ecf1;min-width:0;}
  .pnum{width:clamp(25px,2.4vw,40px);height:clamp(25px,2.4vw,40px);border-radius:50%;background:var(--c);color:#fff;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.2vw,20px);font-weight:800;}
  .pico{display:flex;flex:0 0 auto;}
  .pico svg{width:clamp(20px,2.1vw,36px);height:clamp(20px,2.1vw,36px);stroke:var(--c);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .ptitle{font-size:clamp(17px,2.05vw,35px);font-weight:800;color:#0f2233;line-height:1.15;min-width:0;overflow-wrap:anywhere;}
  .pbody{padding:clamp(11px,1.4vw,22px) clamp(13px,2.1vw,34px) clamp(12px,1.5vw,24px);
    display:flex;flex-direction:column;gap:clamp(9px,1.15vw,18px);overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;}
  .lead{font-size:clamp(13px,1.45vw,25px);line-height:1.4;color:#16324a;font-weight:600;}
  ul{list-style:none;display:flex;flex-direction:column;gap:clamp(9px,1.1vw,17px);}
  li{font-size:clamp(12.5px,1.4vw,24px);line-height:1.45;color:#26394a;
    padding-left:clamp(14px,1.6vw,26px);position:relative;overflow-wrap:anywhere;}
  li::before{content:"";position:absolute;left:1px;top:clamp(7px,.75vw,13px);
    width:clamp(6px,.62vw,10px);height:clamp(6px,.62vw,10px);border-radius:3px;background:var(--c);}
  b{color:#0f2233;font-weight:800;}
  /* ---------- aba participe ---------- */
  .qrbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,1.3vw,20px);text-align:center;min-height:0;}
  .qrimg{width:clamp(150px,24vw,400px);height:auto;display:block;
    border:clamp(5px,.65vw,10px) solid #fff;
    border-radius:14px;box-shadow:0 8px 26px rgba(13,27,42,.25);}
  .qrcap{font-size:clamp(13px,1.55vw,26px);font-weight:600;color:#16324a;}
  .hint{font-size:11px;font-weight:700;letter-spacing:.6px;color:#6f8b99;text-transform:uppercase;
    align-self:center;padding-left:10px;flex:0 0 auto;}
  @media (max-width:1180px){ .hint{display:none;} }
  @media (max-width:760px){ .sub{display:none;} }
  /* ---------- aba em desenvolvimento ---------- */
  .statusbox{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
  .statustxt{font-size:clamp(22px,3.6vw,62px);font-weight:800;color:#0f2233;letter-spacing:.5px;text-align:center;}
</style>
</head>
<body>
  <div class="head">
    <div class="brand">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3.2"/><path d="M4 6v6c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2V6"/><path d="M4 12v6c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2v-6"/></svg>
    </div>
    <div class="titles">
      <h1 id="hTitle"></h1>
      <div class="sub" id="hSub"></div>
    </div>
    <div class="switch">
      <button type="button" id="btnPt" class="on" onclick="setLang('pt')">PORTUGUÊS</button>
      <button type="button" id="btnEs" onclick="setLang('es')">ESPAÑOL</button>
    </div>
  </div>

  <div class="tabbar" id="tabbar"></div>

  <section class="panel" id="panel" style="--c:#0f8f8f"></section>

var lang = "pt";
var cur = 0;

function tabButton(t, i, isOn){
  return '<button type="button" class="tabbtn'+(isOn?' on':'')+'" style="--c:'+t.color+'" '+
    'onclick="show('+i+')"><span class="tnum">'+t.n+'</span><span class="lbl">'+t.short+'</span></button>';
}

function panelHTML(t){
  var head = '<div class="phead">'+
      '<span class="pnum">'+t.n+'</span>'+
      '<span class="pico">'+ICONS[t.icon]+'</span>'+
      '<span class="ptitle">'+t.title+'</span>'+
    '</div>';
  var body;
  if (t.status){
    body = '<div class="pbody"><div class="statusbox"><div class="statustxt">'+t.status+'</div></div></div>';
  } else if (t.qr){
    body = '<div class="pbody"><div class="qrbox">'+
        '<img class="qrimg" src="'+QR_SRC+'" alt="QR code">'+
        '<div class="qrcap">'+t.qrcap+'</div>'+
      '</div></div>';
  } else {
    body = '<div class="pbody">'+
      (t.lead ? '<p class="lead">'+t.lead+'</p>' : '')+
      '<ul>' + t.items.map(function(x){ return '<li>'+x+'</li>'; }).join('') + '</ul>'+
    '</div>';
  }
  return head + body;
}

function paint(){
  var L = DATA[lang];
  document.getElementById('hTitle').textContent = L.title;
  document.getElementById('hSub').textContent = L.sub;
  document.getElementById('tabbar').innerHTML =
    L.tabs.map(function(t,i){ return tabButton(t,i,i===cur); }).join('') +
    '<span class="hint">'+L.hint+'</span>';
  var p = document.getElementById('panel');
  var t = L.tabs[cur];
  p.style.setProperty('--c', t.color);
  p.innerHTML = panelHTML(t);
}

function show(i){
  cur = i;
  paint();
}

function setLang(l, save){
  if (!DATA[l]) l = "pt";
  lang = l;
  document.documentElement.lang = DATA[l].lang;
  document.getElementById('btnPt').classList.toggle('on', l === 'pt');
  document.getElementById('btnEs').classList.toggle('on', l === 'es');
  if (cur > DATA[l].tabs.length - 1) cur = 0;
  paint();
  if (save !== false) { try { localStorage.setItem("dataverse_lang", l); } catch(e){} }
}

document.addEventListener('keydown', function(e){
  var n = DATA[lang].tabs.length;
  if (e.key === 'ArrowRight') { cur = (cur + 1) % n; paint(); }
  if (e.key === 'ArrowLeft') { cur = (cur - 1 + n) % n; paint(); }
});

(function init(){
  var q = new URLSearchParams(location.search);
  var stored = null;
  try { stored = localStorage.getItem("dataverse_lang"); } catch(e){}
  setLang(q.get("lang") || stored || "pt", false);
  var ts = parseInt(q.get("tab"), 10);
  if (!isNaN(ts) && ts >= 1 && ts <= DATA[lang].tabs.length) { cur = ts - 1; paint(); }
})();
</script>
